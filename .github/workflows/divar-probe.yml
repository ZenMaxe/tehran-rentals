# One-off reachability test: can a GitHub runner reach Divar's API?
# ~6 requests, 1.2 s apart. Result is committed to the `probe-results` branch.
name: divar-probe
on:
  push:
    paths: [".github/workflows/divar-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe Divar
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.error
          UA = {"User-Agent": "Mozilla/5.0", "Content-Type": "application/json", "Accept": "application/json"}
          out = {"runner_ip": None, "requests": []}
          try:
              out["runner_ip"] = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
          except Exception as e:
              out["runner_ip"] = f"unknown: {e}"
          def call(method, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=UA, method=method)
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      txt = r.read().decode()
                      rec = {"url": url, "status": r.status, "ms": int((time.time()-t)*1000)}
                      try:
                          return rec, json.loads(txt)
                      except ValueError:
                          rec["note"] = "non-JSON: " + txt[:120]
                          return rec, None
              except urllib.error.HTTPError as e:
                  return {"url": url, "status": e.code, "body": e.read().decode()[:200]}, None
              except Exception as e:
                  return {"url": url, "status": None, "error": str(e)[:200]}, None
          body = {"city_ids": ["1"], "search_data": {"form_data": {"data": {
              "category": {"str": {"value": "apartment-rent"}},
              "credit": {"number_range": {"minimum": "75000000", "maximum": "500000000"}},
              "rent": {"number_range": {"maximum": "17000000"}},
              "districts": {"repeated_string": {"value": ["278"]}}}}}}
          rec, j = call("POST", "https://api.divar.ir/v8/postlist/w/search", body)
          tokens = [w["data"]["token"] for w in (j or {}).get("list_widgets", []) if w.get("widget_type") == "POST_ROW"]
          rec["post_rows"] = len(tokens)
          out["requests"].append(rec)
          for t in tokens[:5]:
              time.sleep(1.2)
              rec, p = call("GET", f"https://api.divar.ir/v8/posts-v2/web/{t}")
              rec["has_webengage_credit"] = bool(p and "credit" in (p.get("webengage") or {}))
              out["requests"].append(rec)
          ok = sum(1 for r in out["requests"] if r.get("status") == 200)
          out["summary"] = f"{ok}/{len(out['requests'])} requests returned 200"
          print(json.dumps(out, indent=1, ensure_ascii=False))
          json.dump(out, open("probe.json", "w"), indent=1, ensure_ascii=False)
          EOF
      - name: Save result to probe-results branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan probe-results
          git rm -rfq --cached . >/dev/null
          git add probe.json
          git commit -qm "Divar probe $(date -u +%FT%TZ)"
          git push -f origin probe-results
