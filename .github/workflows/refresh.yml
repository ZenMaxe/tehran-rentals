# Manual refresh: Actions tab -> "refresh-listings" -> Run workflow.
# Runs the whole pipeline serially (1.2 s between Divar requests), then publishes
# outputs/report.html as index.html (GitHub Pages) plus the Excel files.
name: refresh-listings
on:
  workflow_dispatch:
    inputs:
      skip_routing:
        description: "Skip real walking routes (use straight line x 1.32 estimate)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      # Listing details and routes persist between runs; search checkpoints never do (each run searches fresh)
      - uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/posts
            pipeline/cache/routing_batch
          key: divar-${{ github.run_id }}
          restore-keys: divar-
      - run: python -m pytest -q tests
      - run: python src/main.py
      - if: ${{ !inputs.skip_routing }}
        run: python src/routing_check.py
      - name: Publish site files
        run: |
          cp outputs/report.html ../index.html
          cp outputs/matching_apartments.xlsx outputs/needs_location_verification.xlsx ../
          cd ..
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html matching_apartments.xlsx needs_location_verification.xlsx
          git commit -m "Refresh listings $(date -u +%FT%TZ)" || echo "nothing changed"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            pipeline/outputs
            pipeline/cache/run.log
